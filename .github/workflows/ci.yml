name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DEBUG: "0"
      DJANGO_SECRET_KEY: ci-only-not-for-production
      ALLOWED_HOSTS: localhost
      DATABASE_URL: postgresql://baby_study:ci-only@127.0.0.1:5432/baby_study
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: baby_study
          POSTGRES_USER: baby_study
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baby_study -d baby_study"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: ruff check backend
      - run: ruff format --check backend
      - run: python backend/manage.py check
      - run: python -m unittest discover -s deployment/family -p 'test_*.py'
      - run: python manage.py test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:requests
      - run: npm run typecheck
      - run: npm run build
